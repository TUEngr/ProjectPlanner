<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Project Planner tests</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; }
    .pass { color: #15803d; } .fail { color: #b91c1c; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Project Planner tests</h1>
  <pre id="out">Running…</pre>
  <script type="module">
    import scheduleResults from './schedule.test.js';
    import renderResults from './render.test.js';
    import storageResults from './storage.test.js';
    import repoResults, { ready } from './repo.test.js';
    import mergeResults from './merge.test.js';
    import { encodeShare, decodeShare, normalize } from '../js/storage.js';
    import { samplePlan } from '../js/sample.js';

    const results = [...scheduleResults, ...renderResults, ...storageResults, ...mergeResults];
    await ready; // async repo tests
    results.push(...repoResults);
    try {
      const plan = samplePlan();
      const frag = await encodeShare(plan);
      const back = await decodeShare('#' + frag);
      const same = JSON.stringify(back.tasks) === JSON.stringify(normalize(plan).tasks) && back.name === plan.name;
      results.push([same, `share link round trip (${frag.length} chars for ${plan.tasks.length} tasks)`]);
    } catch (e) {
      results.push([false, `share link round trip: ${e.message}`]);
    }
    try { normalize({}); results.push([false, 'normalize rejects non-plan']); }
    catch { results.push([true, 'normalize rejects non-plan']); }

    const failed = results.filter(r => !r[0]).length;
    document.getElementById('out').innerHTML = results
      .map(([ok, msg]) => `<span class="${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL'}  ${msg}</span>`)
      .join('\n') + `\n\n${results.length - failed}/${results.length} passed`;
  </script>
</body>
</html>
