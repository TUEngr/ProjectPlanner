<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Project Planner UI tests</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; }
    iframe { width: 1300px; height: 700px; border: 1px solid #ccc; }
    .pass { color: #15803d; } .fail { color: #b91c1c; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Project Planner UI tests</h1>
  <p>Drives the real app in the frame below. Uses this browser's storage for the test origin; it creates and deletes a test plan.</p>
  <pre id="out">Running…</pre>
  <iframe id="app" src="../index.html#"></iframe>
  <script type="module">
    const results = [];
    const out = document.getElementById('out');
    const check = (ok, msg) => { results.push([!!ok, msg]); out.textContent = results.map(([o, m]) => (o ? 'PASS  ' : 'FAIL  ') + m).join('\n') + '\n…'; };
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const frame = document.getElementById('app');
    // The frame may finish loading before this deferred module runs
    if (frame.contentDocument?.readyState !== 'complete' || frame.contentWindow.location.href === 'about:blank')
      await new Promise(r => frame.addEventListener('load', r, { once: true }));
    await sleep(400);
    const w = frame.contentWindow, d = frame.contentDocument;

    // Start from a fresh example plan so results don't depend on earlier runs
    d.getElementById('btn-new-sample').click();
    await sleep(100);

    const row = n => d.querySelector(`#tbody tr:nth-child(${n})`);
    const cell = (n, f) => row(n).querySelector(`input[data-f="${f}"]`);
    async function edit(n, f, value, thenFocus = cell(1, 'notes')) {
      const el = cell(n, f);
      el.focus();
      el.value = value;
      thenFocus.focus(); // focusout commits
      await sleep(60);
    }
    const count = () => d.querySelectorAll('#tbody tr[data-id]').length;
    const click = async cmd => { d.querySelector(`[data-cmd="${cmd}"]`).click(); await sleep(60); };

    try {
      const n0 = count();
      check(n0 === 16, `example plan loads 16 rows (got ${n0})`);

      // Duration edit pushes the successor
      const s3 = cell(3, 'start').value;
      await edit(2, 'duration', '2w');
      check(cell(2, 'duration').value === '10', `"2w" parses to 10 working days (got ${cell(2, 'duration').value})`);
      check(cell(3, 'start').value > s3, `successor moved later (${s3} → ${cell(3, 'start').value})`);

      // Invalid input is rejected and restored
      await edit(2, 'duration', 'abc');
      check(cell(2, 'duration').value === '10', 'invalid duration rejected and restored');

      // Undo / redo
      await click('undo');
      check(cell(2, 'duration').value === '5', `undo restores duration (got ${cell(2, 'duration').value})`);
      await click('redo');
      check(cell(2, 'duration').value === '10', 'redo reapplies duration');
      await click('undo');

      // Predecessor edit changes critical path: Firmware (13) after Order parts (9)
      check(!row(13).classList.contains('critical'), 'Firmware not critical initially');
      await edit(13, 'preds', '9');
      check(row(13).classList.contains('critical'), 'Firmware critical after linking to row 9');
      check(d.querySelectorAll('#gantt-pane .g-link.critical').length > 0, 'Gantt draws critical links');
      await click('undo');

      // Bad predecessor reference
      await edit(13, 'preds', '99');
      check(cell(13, 'preds').value === '7', 'reference to missing row rejected');

      // Pin a start date earlier than the predecessor allows -> warning
      await edit(3, 'start', cell(2, 'start').value);
      check(row(3).querySelector('.c-date.pinned') && row(3).classList.contains('has-issue'), 'pinned conflicting start is kept and flagged ⚠');
      row(3).querySelector('[data-act="unpin"]').click();
      await sleep(60);
      check(!row(3).querySelector('.c-date.pinned') && !row(3).classList.contains('has-issue'), 'unpin clears pin and warning');

      // Finish edit changes duration
      const st = cell(6, 'start').value;
      const fin = new Date(st + 'T00:00:00Z'); fin.setUTCDate(fin.getUTCDate() + 2); // Mon -> Wed
      await edit(6, 'finish', fin.toISOString().slice(0, 10));
      check(cell(6, 'duration').value === '3', `finish date sets duration (got ${cell(6, 'duration').value})`);

      // Add, indent, delete
      cell(16, 'name').focus(); await sleep(20);
      await click('add');
      check(count() === n0 + 1, 'add task appends a row');
      check(d.activeElement === cell(17, 'name'), 'new row name is focused');
      await click('indent');
      check(row(16).classList.contains('summary'), 'indent makes row above a summary');
      await click('outdent');
      check(!row(16).classList.contains('summary'), 'outdent reverses it');
      await click('delete');
      check(count() === n0, 'delete removes the row');

      // Enter on last name cell adds a row
      const last = cell(16, 'name');
      last.focus();
      last.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      await sleep(100);
      check(count() === n0 + 1, 'Enter on last row adds a task');

      // ---- SS / FF links ----
      await edit(7, 'preds', '6ss');
      check(cell(7, 'preds').value === '6SS' && cell(7, 'start').value === cell(6, 'start').value,
        `SS: Electrical schematic starts with Mechanical CAD (${cell(7, 'start').value})`);
      await edit(8, 'preds', '6 FF');
      check(cell(8, 'preds').value === '6FF' && cell(8, 'finish').value === cell(6, 'finish').value,
        `FF: PCB layout finishes with Mechanical CAD (${cell(8, 'finish').value})`);
      await edit(8, 'preds', '6SX');
      check(cell(8, 'preds').value === '6FF', 'malformed link type rejected');
      check(d.querySelectorAll('#gantt-pane .g-link').length === 15, 'Gantt still draws one arrow per link');
      await click('undo'); await click('undo');
      check(cell(7, 'preds').value === '4' && cell(8, 'preds').value === '7', 'undo restores FS links');

      // ---- Reordering ----
      d.querySelector('.tabs button[data-view="split"]').click();
      await sleep(60);
      const names = () => [...d.querySelectorAll('#tbody input[data-f="name"]')].map(i => i.value);
      const before = names().join('|');
      const pe = (type, el, y) => el.dispatchEvent(new w.PointerEvent(type, {
        bubbles: true, cancelable: true, pointerId: 1, button: 0, isPrimary: true,
        clientX: el.getBoundingClientRect().left + 5, clientY: y,
      }));
      async function drag(fromEl, toY) {
        const y0 = fromEl.getBoundingClientRect().top + 5;
        pe('pointerdown', fromEl, y0);
        pe('pointermove', fromEl, y0 + (toY > y0 ? 8 : -8));
        pe('pointermove', fromEl, toY);
        pe('pointerup', fromEl, toY);
        await sleep(80);
      }
      const gRow = n => d.querySelectorAll('#gantt-pane .g-row')[n - 1];
      const top = el => el.getBoundingClientRect().top;

      // Gantt: drag Firmware (13) to just above Fabricate chassis (11)
      await drag(gRow(13), top(gRow(11)) + 3);
      check(cell(11, 'name').value === 'Firmware' && cell(12, 'name').value === 'Fabricate chassis',
        `Gantt drag moves Firmware to row 11 (row 11 = ${cell(11, 'name').value})`);
      check(cell(11, 'preds').value === '7' && cell(14, 'preds').value === '11, 12, 13',
        'dependencies follow the moved task (row numbers renumbered)');
      check(!row(11).classList.contains('summary') && row(10).classList.contains('summary'), 'moved task stays inside its group');
      await click('undo');
      check(names().join('|') === before, 'undo restores order after Gantt drag');

      // Table: drag the Detailed design summary (5) by its row number to the very end
      const n = count();
      const lastBottom = row(n).getBoundingClientRect().bottom - 2;
      await drag(row(5).querySelector('.c-num'), lastBottom);
      check(cell(n - 4, 'name').value === 'Detailed design' && cell(n, 'name').value === 'Order parts',
        `table drag moves a summary with its 4 subtasks (row ${n - 4} = ${cell(n - 4, 'name').value})`);
      check(row(n - 4).classList.contains('summary') && count() === n, 'summary still a summary; no rows lost');
      await click('undo');

      // Dropping a summary inside its own subtree does nothing
      await drag(row(5).querySelector('.c-num'), top(row(7)) + 3);
      check(names().join('|') === before, 'drop into own subtree is ignored');

      // A drag doesn't eat the next click
      const g3 = gRow(3);
      g3.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
      await sleep(20);
      check(row(3).classList.contains('selected'), 'click after a drag still selects');

      // ↑ on a top-level group jumps the previous group; ↓ on a subtask passes one sibling
      cell(10, 'name').focus(); await sleep(20);
      await click('up');
      check(cell(5, 'name').value === 'Build & test' && row(5).classList.contains('summary')
        && cell(11, 'name').value === 'Detailed design', `↑ moves Build & test above Detailed design (row 5 = ${cell(5, 'name').value})`);
      await click('undo');
      cell(6, 'name').focus(); await sleep(20);
      await click('down');
      check(cell(7, 'name').value === 'Mechanical CAD' && cell(6, 'name').value === 'Electrical schematic', '↓ swaps Mechanical CAD with next sibling');
      await click('undo');
      check(names().join('|') === before, 'order restored');

      // ---- Collapse / expand ----
      const visibleNames = () => [...d.querySelectorAll('#tbody tr[data-id] input[data-f="name"]')].map(i => i.value);
      const gLabels = () => d.querySelectorAll('#gantt-pane .g-row').length;
      const dbl = el => {
        el.dispatchEvent(new w.MouseEvent('click', { bubbles: true, detail: 1 }));
        el.dispatchEvent(new w.MouseEvent('click', { bubbles: true, detail: 2 }));
        el.dispatchEvent(new w.MouseEvent('dblclick', { bubbles: true, detail: 2 }));
      };
      const rowsBefore = count();
      dbl(gRow(5).querySelector('.g-label'));
      await sleep(60);
      check(count() === rowsBefore - 4 && !visibleNames().includes('Mechanical CAD') && gLabels() === rowsBefore - 4,
        `double-click a Gantt summary hides its 4 subtasks (${count()} rows)`);
      check(row(5).querySelector('.twisty').textContent === '▸', 'collapsed summary shows ▸');
      check(cell(5, 'name').value === 'Detailed design' && row(5).nextElementSibling.querySelector('input[data-f="name"]').value === 'Build & test',
        'rows after the group keep their row numbers');
      dbl(cell(5, 'name'));
      await sleep(60);
      check(count() === rowsBefore && row(5).querySelector('.twisty').textContent === '▾', 'double-click the table row expands it');
      // A double-click on the triangle toggles once
      dbl(row(5).querySelector('.twisty'));
      await sleep(60);
      check(count() === rowsBefore - 4, 'double-click on the triangle collapses (toggles once)');
      // + Task on a collapsed summary adds after the group and leaves it collapsed
      cell(5, 'name').focus(); await sleep(20);
      await click('add');
      check(count() === rowsBefore - 3 && row(5).querySelector('.twisty').textContent === '▸'
        && d.activeElement?.closest('tr') === row(5).nextElementSibling, '+ Task on a collapsed group adds a sibling after it');
      await click('undo');
      // Dragging a task to just below a collapsed group makes it a sibling, not a hidden child
      const gIdx = name => [...d.querySelectorAll('#gantt-pane .g-row')].findIndex(g => g.textContent.includes(name));
      const ganttRows = () => d.querySelectorAll('#gantt-pane .g-row');
      const define = ganttRows()[gIdx('Define requirements')];
      const bt = ganttRows()[gIdx('Build & test')];
      await drag(define, top(bt) + 3);
      check(visibleNames().includes('Define requirements') && count() === rowsBefore - 4,
        'task dropped below a collapsed group stays visible as its sibling');
      await click('undo');
      // Click the triangle to expand again; state is saved without an undo step
      row(5).querySelector('.twisty').dispatchEvent(new w.MouseEvent('click', { bubbles: true, detail: 1 }));
      await sleep(60);
      check(count() === rowsBefore, 'single click on the triangle expands');

      // ---- PNG export: capture the download instead of saving it ----
      const captured = new Promise(resolve => {
        const origURL = w.URL.createObjectURL, origClick = w.HTMLAnchorElement.prototype.click;
        let lastBlob = null;
        w.URL.createObjectURL = b => { lastBlob = b; return origURL.call(w.URL, b); };
        w.HTMLAnchorElement.prototype.click = function () {
          if (!this.download.endsWith('.png')) return origClick.call(this);
          w.URL.createObjectURL = origURL; w.HTMLAnchorElement.prototype.click = origClick;
          resolve({ name: this.download, blob: lastBlob });
        };
      });
      d.getElementById('btn-png').click();
      const dl = await Promise.race([captured, sleep(5000).then(() => null)]);
      check(dl && /-gantt\.png$/.test(dl.name), `PNG download offered (${dl?.name})`);
      if (dl) {
        const blob = dl.blob;
        const bmp = new Image();
        bmp.src = URL.createObjectURL(blob);
        await bmp.decode();
        const svgW = d.querySelector('#gantt-pane .g-body svg').width.baseVal.value + 280;
        check(blob.type === 'image/png' && bmp.width === svgW * 2, `PNG is 2× the chart width (${bmp.width} px for ${svgW} px chart)`);
        // Sample pixels: white background, and red somewhere (critical path)
        const c = Object.assign(document.createElement('canvas'), { width: bmp.width, height: bmp.height }), cx = c.getContext('2d');
        cx.drawImage(bmp, 0, 0);
        const px = cx.getImageData(0, 0, bmp.width, bmp.height).data;
        let red = 0;
        for (let k = 0; k < px.length; k += 16) if (px[k] > 200 && px[k + 1] < 80 && px[k + 2] < 80) red++;
        check(red > 100, `critical path drawn in red (${red} sampled red pixels)`);
        document.body.insertAdjacentHTML('beforeend', `<h2>Exported PNG</h2><img id="png-out" style="max-width:100%;border:1px solid #ccc" src="${bmp.src}">`);
      }

      // ---- PERT tab ----
      d.querySelector('.tabs button[data-view="pert"]').click();
      await sleep(80);
      const nodes = d.querySelectorAll('#pert-pane .pt-node');
      const leafRows = [...d.querySelectorAll('#tbody tr[data-id]')].filter(tr => !tr.classList.contains('summary')).length;
      check(nodes.length === leafRows && d.getElementById('zoom').disabled, `PERT tab draws one box per task (${nodes.length}); zoom disabled`);
      check(d.querySelectorAll('#pert-pane .pt-node.critical').length === d.querySelectorAll('#tbody tr.critical').length,
        'PERT critical boxes match critical rows');
      const fw = [...nodes].find(n => n.textContent.includes('Firmware'));
      fw.dispatchEvent(new w.MouseEvent('click', { bubbles: true, detail: 1 }));
      await sleep(20);
      check(fw.classList.contains('selected') && d.querySelector('#tbody tr.selected input[data-f="name"]').value === 'Firmware',
        'clicking a PERT box selects that task');
      const pngPert = new Promise(resolve => {
        const orig = w.HTMLAnchorElement.prototype.click;
        w.HTMLAnchorElement.prototype.click = function () { w.HTMLAnchorElement.prototype.click = orig; resolve(this.download); };
      });
      d.getElementById('btn-png').click();
      const pertName = await Promise.race([pngPert, sleep(5000).then(() => null)]);
      check(/-pert\.png$/.test(pertName || ''), `Export PNG on the PERT tab exports the diagram (${pertName})`);
      fw.dispatchEvent(new w.MouseEvent('dblclick', { bubbles: true, detail: 2 }));
      await sleep(60);
      check(d.getElementById('main').className === 'view-table' && d.activeElement?.value === 'Firmware',
        'double-clicking a PERT task opens it in the table');
      d.querySelector('.tabs button[data-view="split"]').click();
      await sleep(60);

      // Persistence: reload the frame, plan is still there with edits
      const name = d.getElementById('plan-name').textContent;
      w.location.reload();
      await new Promise(r => frame.addEventListener('load', r, { once: true }));
      await sleep(400);
      const d2 = frame.contentDocument;
      check(d2.getElementById('plan-name').textContent === name && d2.querySelectorAll('#tbody tr[data-id]').length === n0 + 1,
        'plan persists across reload');
    } catch (e) {
      check(false, `exception: ${e.message}`);
    }

    const failed = results.filter(r => !r[0]).length;
    document.getElementById('out').innerHTML = results
      .map(([ok, msg]) => `<span class="${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL'}  ${msg}</span>`)
      .join('\n') + `\n\n${results.length - failed}/${results.length} passed`;
  </script>
</body>
</html>
