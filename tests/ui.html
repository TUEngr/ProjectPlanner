<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Project Planner UI tests</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; }
    iframe { width: 1300px; height: 700px; border: 1px solid #ccc; }
    .pass { color: #15803d; } .fail { color: #b91c1c; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Project Planner UI tests</h1>
  <p>Drives the real app in the frame below. Uses this browser's storage for the test origin; it creates and deletes a test plan.</p>
  <pre id="out">Running…</pre>
  <iframe id="app" src="../index.html#"></iframe>
  <script type="module">
    const results = [];
    const out = document.getElementById('out');
    const check = (ok, msg) => { results.push([!!ok, msg]); out.textContent = results.map(([o, m]) => (o ? 'PASS  ' : 'FAIL  ') + m).join('\n') + '\n…'; };
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const frame = document.getElementById('app');
    // The frame may finish loading before this deferred module runs
    if (frame.contentDocument?.readyState !== 'complete' || frame.contentWindow.location.href === 'about:blank')
      await new Promise(r => frame.addEventListener('load', r, { once: true }));
    await sleep(400);
    const w = frame.contentWindow, d = frame.contentDocument;

    // Start from a fresh example plan so results don't depend on earlier runs
    d.getElementById('btn-new-sample').click();
    await sleep(100);

    const row = n => d.querySelector(`#tbody tr:nth-child(${n})`);
    const cell = (n, f) => row(n).querySelector(`input[data-f="${f}"]`);
    async function edit(n, f, value, thenFocus = cell(1, 'notes')) {
      const el = cell(n, f);
      el.focus();
      el.value = value;
      thenFocus.focus(); // focusout commits
      await sleep(60);
    }
    const count = () => d.querySelectorAll('#tbody tr[data-id]').length;
    const click = async cmd => { d.querySelector(`[data-cmd="${cmd}"]`).click(); await sleep(60); };

    try {
      const n0 = count();
      check(n0 === 16, `example plan loads 16 rows (got ${n0})`);

      // Duration edit pushes the successor
      const s3 = cell(3, 'start').value;
      await edit(2, 'duration', '2w');
      check(cell(2, 'duration').value === '10', `"2w" parses to 10 working days (got ${cell(2, 'duration').value})`);
      check(cell(3, 'start').value > s3, `successor moved later (${s3} → ${cell(3, 'start').value})`);

      // Invalid input is rejected and restored
      await edit(2, 'duration', 'abc');
      check(cell(2, 'duration').value === '10', 'invalid duration rejected and restored');

      // Undo / redo
      await click('undo');
      check(cell(2, 'duration').value === '5', `undo restores duration (got ${cell(2, 'duration').value})`);
      await click('redo');
      check(cell(2, 'duration').value === '10', 'redo reapplies duration');
      await click('undo');

      // Predecessor edit changes critical path: Firmware (13) after Order parts (9)
      check(!row(13).classList.contains('critical'), 'Firmware not critical initially');
      await edit(13, 'preds', '9');
      check(row(13).classList.contains('critical'), 'Firmware critical after linking to row 9');
      check(d.querySelectorAll('#gantt-pane .g-link.critical').length > 0, 'Gantt draws critical links');
      await click('undo');

      // Bad predecessor reference
      await edit(13, 'preds', '99');
      check(cell(13, 'preds').value === '7', 'reference to missing row rejected');

      // Pin a start date earlier than the predecessor allows -> warning
      await edit(3, 'start', cell(2, 'start').value);
      check(row(3).querySelector('.c-date.pinned') && row(3).classList.contains('has-issue'), 'pinned conflicting start is kept and flagged ⚠');
      const tipEl = d.getElementById('tip');
      const hover = el => el.dispatchEvent(new w.PointerEvent('pointerover', { bubbles: true }));
      hover(row(3).querySelector('.flag'));
      check(!tipEl.hidden && /predecessor 2 finishes/.test(tipEl.textContent) && tipEl.getBoundingClientRect().width > 0,
        `hovering ⚠ shows the conflict at once ("${tipEl.textContent}")`);
      hover(d.querySelector('#gantt-pane .g-row[data-id="3"] .g-pin'));
      check(!tipEl.hidden && /^Pinned start date/.test(tipEl.textContent), `hovering the Gantt 📌 shows a tooltip ("${tipEl.textContent}")`);
      hover(row(4).querySelector('.flag.ms'));
      check(!tipEl.hidden && /Milestone/.test(tipEl.textContent), 'hovering ◆ shows "Milestone"');
      hover(d.querySelector('#gantt-pane .g-task[data-id="13"] .g-bar'));
      check(!tipEl.hidden && /^13\. Firmware/.test(tipEl.textContent) && /float/.test(tipEl.textContent),
        `hovering a Gantt bar shows its details ("${tipEl.textContent.split('\n')[0]}")`);
      hover(cell(4, 'notes'));
      check(tipEl.hidden, 'tooltip hides when the pointer leaves');
      row(3).querySelector('[data-act="unpin"]').click();
      await sleep(60);
      check(!row(3).querySelector('.c-date.pinned') && !row(3).classList.contains('has-issue'), 'unpin clears pin and warning');

      // Finish edit changes duration
      const st = cell(6, 'start').value;
      const fin = new Date(st + 'T00:00:00Z'); fin.setUTCDate(fin.getUTCDate() + 2); // Mon -> Wed
      await edit(6, 'finish', fin.toISOString().slice(0, 10));
      check(cell(6, 'duration').value === '3', `finish date sets duration (got ${cell(6, 'duration').value})`);

      // Add, indent, delete
      cell(16, 'name').focus(); await sleep(20);
      await click('add');
      check(count() === n0 + 1, 'add task appends a row');
      check(d.activeElement === cell(17, 'name'), 'new row name is focused');
      await click('indent');
      check(row(16).classList.contains('summary'), 'indent makes row above a summary');
      await click('outdent');
      check(!row(16).classList.contains('summary'), 'outdent reverses it');
      await click('delete');
      check(count() === n0, 'delete removes the row');

      // Enter on last name cell adds a row
      const last = cell(16, 'name');
      last.focus();
      last.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      await sleep(100);
      check(count() === n0 + 1, 'Enter on last row adds a task');

      // ---- SS / FF links ----
      await edit(7, 'preds', '6ss');
      check(cell(7, 'preds').value === '6SS' && cell(7, 'start').value === cell(6, 'start').value,
        `SS: Electrical schematic starts with Mechanical CAD (${cell(7, 'start').value})`);
      await edit(8, 'preds', '6 FF');
      check(cell(8, 'preds').value === '6FF' && cell(8, 'finish').value === cell(6, 'finish').value,
        `FF: PCB layout finishes with Mechanical CAD (${cell(8, 'finish').value})`);
      await edit(8, 'preds', '6SX');
      check(cell(8, 'preds').value === '6FF', 'malformed link type rejected');
      check(d.querySelectorAll('#gantt-pane .g-link').length === 15, 'Gantt still draws one arrow per link');
      await click('undo'); await click('undo');
      check(cell(7, 'preds').value === '4' && cell(8, 'preds').value === '7', 'undo restores FS links');

      // ---- Weekend settings ----
      d.getElementById('btn-settings').click();
      await sleep(40);
      const sf = d.getElementById('settings-form');
      check(sf.satOff.checked && sf.sunOff.checked, 'Settings: both weekend boxes checked by default');
      const fin16 = cell(16, 'finish').value;
      sf.satOff.checked = false;
      sf.querySelector('button[value="save"]').click();
      await sleep(80);
      check(cell(16, 'finish').value < fin16, `working Saturdays pulls the finish in (${fin16} → ${cell(16, 'finish').value})`);
      check(!d.getElementById('dlg-settings').open, 'settings dialog closed on save');
      await click('undo');
      check(cell(16, 'finish').value === fin16, 'undo restores weekends off');

      // ---- Include Gantt / PERT ----
      const tab = v => d.querySelector(`.tabs button[data-view="${v}"]`);
      const settings = async (gantt, pertOn) => {
        d.getElementById('btn-settings').click(); await sleep(40);
        const f = d.getElementById('settings-form');
        f.showGantt.checked = gantt; f.showPert.checked = pertOn;
        f.querySelector('button[value="save"]').click(); await sleep(80);
      };
      d.getElementById('btn-settings').click(); await sleep(40);
      check(d.getElementById('settings-form').showGantt.checked && d.getElementById('settings-form').showPert.checked,
        'Settings: Include Gantt and Include PERT checked by default');
      d.getElementById('settings-form').querySelector('button[value="cancel"]').click(); await sleep(40);
      tab('split').click(); await sleep(60);
      await settings(false, true);
      check(tab('gantt').hidden && tab('split').hidden && !tab('pert').hidden && !tab('split-pert').hidden && !tab('table').hidden,
        'Include Gantt off hides Gantt and Table/Gantt tabs only');
      check(d.getElementById('main').className === 'view-table', 'view on a hidden tab falls back to Table');
      await settings(true, false);
      check(!tab('gantt').hidden && !tab('split').hidden && tab('pert').hidden && tab('split-pert').hidden,
        'Include PERT off hides PERT and Table/PERT tabs only');
      await settings(false, false);
      check(!d.getElementById('btn-png').disabled && !d.getElementById('btn-print').disabled && /task table/.test(d.getElementById('png-kind').textContent),
        'with no charts, PNG and Print stay available and output the table');
      await click('undo'); await click('undo'); await click('undo');
      check(['table', 'gantt', 'pert', 'split', 'split-pert'].every(v => !tab(v).hidden) && !d.getElementById('btn-png').disabled,
        'undo restores all views');
      tab('split').click(); await sleep(60);

      // ---- Reordering ----
      d.querySelector('.tabs button[data-view="split"]').click();
      await sleep(60);
      const names = () => [...d.querySelectorAll('#tbody input[data-f="name"]')].map(i => i.value);
      const before = names().join('|');
      const pe = (type, el, y) => el.dispatchEvent(new w.PointerEvent(type, {
        bubbles: true, cancelable: true, pointerId: 1, button: 0, isPrimary: true,
        clientX: el.getBoundingClientRect().left + 5, clientY: y,
      }));
      async function drag(fromEl, toY) {
        const y0 = fromEl.getBoundingClientRect().top + 5;
        pe('pointerdown', fromEl, y0);
        pe('pointermove', fromEl, y0 + (toY > y0 ? 8 : -8));
        pe('pointermove', fromEl, toY);
        pe('pointerup', fromEl, toY);
        await sleep(80);
      }
      const gRow = n => d.querySelectorAll('#gantt-pane .g-row')[n - 1];
      const top = el => el.getBoundingClientRect().top;

      // Gantt: drag Firmware (13) to just above Fabricate chassis (11)
      await drag(gRow(13), top(gRow(11)) + 3);
      check(cell(11, 'name').value === 'Firmware' && cell(12, 'name').value === 'Fabricate chassis',
        `Gantt drag moves Firmware to row 11 (row 11 = ${cell(11, 'name').value})`);
      check(cell(11, 'preds').value === '7' && cell(14, 'preds').value === '11, 12, 13',
        'dependencies follow the moved task (row numbers renumbered)');
      check(!row(11).classList.contains('summary') && row(10).classList.contains('summary'), 'moved task stays inside its group');
      await click('undo');
      check(names().join('|') === before, 'undo restores order after Gantt drag');

      // Table: drag the Detailed design summary (5) by its row number to the very end
      const n = count();
      const lastBottom = row(n).getBoundingClientRect().bottom - 2;
      await drag(row(5).querySelector('.c-num'), lastBottom);
      check(cell(n - 4, 'name').value === 'Detailed design' && cell(n, 'name').value === 'Order parts',
        `table drag moves a summary with its 4 subtasks (row ${n - 4} = ${cell(n - 4, 'name').value})`);
      check(row(n - 4).classList.contains('summary') && count() === n, 'summary still a summary; no rows lost');
      await click('undo');

      // Dropping a summary inside its own subtree does nothing
      await drag(row(5).querySelector('.c-num'), top(row(7)) + 3);
      check(names().join('|') === before, 'drop into own subtree is ignored');

      // A drag doesn't eat the next click
      const g3 = gRow(3);
      g3.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
      await sleep(20);
      check(row(3).classList.contains('selected'), 'click after a drag still selects');

      // ↑ on a top-level group jumps the previous group; ↓ on a subtask passes one sibling
      cell(10, 'name').focus(); await sleep(20);
      await click('up');
      check(cell(5, 'name').value === 'Build & test' && row(5).classList.contains('summary')
        && cell(11, 'name').value === 'Detailed design', `↑ moves Build & test above Detailed design (row 5 = ${cell(5, 'name').value})`);
      await click('undo');
      cell(6, 'name').focus(); await sleep(20);
      await click('down');
      check(cell(7, 'name').value === 'Mechanical CAD' && cell(6, 'name').value === 'Electrical schematic', '↓ swaps Mechanical CAD with next sibling');
      await click('undo');
      check(names().join('|') === before, 'order restored');

      // ---- Collapse / expand ----
      const visibleNames = () => [...d.querySelectorAll('#tbody tr[data-id] input[data-f="name"]')].map(i => i.value);
      const gLabels = () => d.querySelectorAll('#gantt-pane .g-row').length;
      const dbl = el => {
        el.dispatchEvent(new w.MouseEvent('click', { bubbles: true, detail: 1 }));
        el.dispatchEvent(new w.MouseEvent('click', { bubbles: true, detail: 2 }));
        el.dispatchEvent(new w.MouseEvent('dblclick', { bubbles: true, detail: 2 }));
      };
      const rowsBefore = count();
      dbl(gRow(5).querySelector('.g-label'));
      await sleep(60);
      check(count() === rowsBefore - 4 && !visibleNames().includes('Mechanical CAD') && gLabels() === rowsBefore - 4,
        `double-click a Gantt summary hides its 4 subtasks (${count()} rows)`);
      check(row(5).querySelector('.twisty').textContent === '▸', 'collapsed summary shows ▸');
      check(cell(5, 'name').value === 'Detailed design' && row(5).nextElementSibling.querySelector('input[data-f="name"]').value === 'Build & test',
        'rows after the group keep their row numbers');
      dbl(cell(5, 'name'));
      await sleep(60);
      check(count() === rowsBefore && row(5).querySelector('.twisty').textContent === '▾', 'double-click the table row expands it');
      // A double-click on the triangle toggles once
      dbl(row(5).querySelector('.twisty'));
      await sleep(60);
      check(count() === rowsBefore - 4, 'double-click on the triangle collapses (toggles once)');
      // + Task on a collapsed summary adds after the group and leaves it collapsed
      cell(5, 'name').focus(); await sleep(20);
      await click('add');
      check(count() === rowsBefore - 3 && row(5).querySelector('.twisty').textContent === '▸'
        && d.activeElement?.closest('tr') === row(5).nextElementSibling, '+ Task on a collapsed group adds a sibling after it');
      await click('undo');
      // Dragging a task to just below a collapsed group makes it a sibling, not a hidden child
      const gIdx = name => [...d.querySelectorAll('#gantt-pane .g-row')].findIndex(g => g.textContent.includes(name));
      const ganttRows = () => d.querySelectorAll('#gantt-pane .g-row');
      const define = ganttRows()[gIdx('Define requirements')];
      const bt = ganttRows()[gIdx('Build & test')];
      await drag(define, top(bt) + 3);
      check(visibleNames().includes('Define requirements') && count() === rowsBefore - 4,
        'task dropped below a collapsed group stays visible as its sibling');
      await click('undo');
      // Click the triangle to expand again; state is saved without an undo step
      row(5).querySelector('.twisty').dispatchEvent(new w.MouseEvent('click', { bubbles: true, detail: 1 }));
      await sleep(60);
      check(count() === rowsBefore, 'single click on the triangle expands');

      // ---- Export menu ----
      const menuBtn = d.getElementById('btn-export-menu'), menu = d.getElementById('export-menu');
      check(!d.querySelector('.actions #btn-png') && !d.querySelector('.actions #btn-share') && !d.querySelector('.actions #btn-export'),
        'Save file / Share link / Export PNG buttons replaced by the Export menu');
      menuBtn.click(); await sleep(30);
      const items = [...menu.querySelectorAll('[role="menuitem"]')].map(b => b.querySelector('b').textContent);
      check(!menu.hidden && menuBtn.getAttribute('aria-expanded') === 'true' && items.join('|') === 'Read-only link…|JSON file|CSV file|PNG image|Print…',
        `Export menu opens with 5 items (${items.join(', ')})`);
      check(!d.querySelector('.actions #btn-print') && d.querySelector('#export-menu #btn-print'), 'Print moved from the header into the Export menu');
      check(d.activeElement === menu.querySelector('#btn-share'), 'first item is focused');
      menu.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
      check(d.activeElement?.id === 'btn-export', 'ArrowDown moves to the next item');
      menu.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      check(menu.hidden && d.activeElement === menuBtn, 'Escape closes the menu and returns focus');
      menuBtn.click(); await sleep(30);
      d.body.dispatchEvent(new w.PointerEvent('pointerdown', { bubbles: true }));
      check(menu.hidden, 'clicking outside closes the menu');
      const grab = ext => new Promise(resolve => {
        const oc = w.HTMLAnchorElement.prototype.click, ou = w.URL.createObjectURL;
        let blob = null;
        w.URL.createObjectURL = b => { blob = b; return ou.call(w.URL, b); };
        w.HTMLAnchorElement.prototype.click = function () {
          if (!this.download.endsWith(ext)) return oc.call(this);
          w.HTMLAnchorElement.prototype.click = oc; w.URL.createObjectURL = ou;
          resolve({ name: this.download, blob });
        };
      });
      menuBtn.click(); await sleep(30);
      let got = grab('.csv');
      menu.querySelector('#btn-csv').click();
      let dlc = await Promise.race([got, sleep(3000).then(() => null)]);
      const text = dlc ? await dlc.blob.text() : '';
      // text() drops the byte-order mark, so check the raw bytes for it
      const bom = dlc ? [...new Uint8Array(await dlc.blob.slice(0, 3).arrayBuffer())].join() === '239,187,191' : false;
      check(menu.hidden && dlc && /\.csv$/.test(dlc.name) && text.split('\r\n')[0].startsWith('WBS,Row,') && bom && text.includes('Firmware'),
        `CSV file downloads the task table (${dlc?.name}, ${text.split('\r\n').length - 2} task rows)`);
      menuBtn.click(); await sleep(30);
      got = grab('.json');
      menu.querySelector('#btn-export').click();
      dlc = await Promise.race([got, sleep(3000).then(() => null)]);
      const js = dlc ? JSON.parse(await dlc.blob.text()) : null;
      check(js && Array.isArray(js.tasks) && js.tasks.some(t => t.name === 'Firmware'), `JSON file downloads the plan (${dlc?.name})`);
      menuBtn.click(); await sleep(30);
      menu.querySelector('#btn-share').click(); await sleep(300);
      check(d.getElementById('dlg-share').open && /#share=/.test(d.getElementById('share-url').value || d.getElementById('share-url').textContent),
        'Read-only link opens the share dialog with a link');
      d.getElementById('dlg-share').close();

      // ---- Open menu: CSV / JSON import ----
      const openBtn = d.getElementById('btn-open-menu'), openMenu = d.getElementById('open-menu');
      openBtn.click(); await sleep(30);
      check(!openMenu.hidden && [...openMenu.querySelectorAll('[role="menuitem"] b')].map(b => b.textContent).join('|') === 'JSON file|CSV file',
        'Open menu offers JSON file and CSV file');
      d.getElementById('btn-import-csv').click(); await sleep(20);
      check(openMenu.hidden && d.getElementById('file-input').accept.includes('.csv'), 'CSV item opens a CSV file picker');
      const feed = async (name, text) => {
        const dt = new w.DataTransfer();
        dt.items.add(new w.File([text], name, { type: 'text/csv' }));
        const inp = d.getElementById('file-input');
        inp.files = dt.files;
        inp.dispatchEvent(new w.Event('change', { bubbles: true }));
        await sleep(150);
      };
      const planBefore = d.getElementById('plan-name').textContent;
      await feed('Garden.csv', 'WBS,Task,Duration,Predecessors\n1,Prep,,\n1.1,Dig beds,3,\n1.2,Plant,2,2SS\n2,Harvest,0,3\n');
      check(d.getElementById('plan-name').textContent === 'Garden' && count() === 4 && row(1).classList.contains('summary')
        && cell(3, 'preds').value === '2SS' && cell(4, 'duration').value === '0',
        `valid CSV opens as a new plan (${d.getElementById('plan-name').textContent}, ${count()} rows)`);
      await feed('junk.csv', 'Foo,Bar\n1,2\n');
      const errDlg = d.getElementById('dlg-import-error');
      check(errDlg.open && /junk\.csv/.test(d.getElementById('import-error-msg').textContent) && /Task/.test(d.getElementById('import-error-msg').textContent),
        `bad CSV shows an error dialog ("${d.getElementById('import-error-msg').textContent}")`);
      check(d.getElementById('plan-name').textContent === 'Garden', 'failed import leaves the current plan open');
      const tpl = new Promise(resolve => {
        const oc = w.HTMLAnchorElement.prototype.click, ou = w.URL.createObjectURL;
        let blob = null;
        w.URL.createObjectURL = b => { blob = b; return ou.call(w.URL, b); };
        w.HTMLAnchorElement.prototype.click = function () { w.HTMLAnchorElement.prototype.click = oc; w.URL.createObjectURL = ou; resolve({ name: this.download, blob }); };
      });
      d.getElementById('btn-csv-template').click();
      const tdl = await Promise.race([tpl, sleep(3000).then(() => null)]);
      const ttext = tdl ? await tdl.blob.text() : '';
      check(tdl && tdl.name === 'project-planner-template.csv' && ttext.startsWith('Row,Outline level,Task') && !errDlg.open,
        'error dialog downloads the template CSV and closes');
      await feed('template.csv', ttext);
      check(d.getElementById('plan-name').textContent === 'template' && count() === 6, 'the template itself imports (6 rows)');
      // JSON still opens through the same picker
      await feed('rt.json', JSON.stringify({ name: 'From JSON', start: '2026-10-05', tasks: [{ id: 1, name: 'Only task', duration: 2, preds: [] }] }));
      check(d.getElementById('plan-name').textContent === 'From JSON' && count() === 1, 'JSON file still opens');
      // Back to the example plan used by the remaining tests
      d.getElementById('btn-plans').click(); await sleep(40);
      const li = [...d.querySelectorAll('#plan-list li')].find(l => l.textContent.includes(planBefore));
      li?.querySelector('[data-act="open"]').click(); await sleep(100);
      check(d.getElementById('plan-name').textContent === planBefore, `reopened “${planBefore}” for the remaining tests`);

      // ---- Export / Print on the Table tab output the table ----
      d.querySelector('.tabs button[data-view="table"]').click(); await sleep(60);
      check(/task table/.test(d.getElementById('png-kind').textContent) && /task table/.test(d.getElementById('print-kind').textContent),
        'on the Table tab, PNG and Print describe the task table');
      const tpng = new Promise(resolve => {
        const oc = w.HTMLAnchorElement.prototype.click;
        w.HTMLAnchorElement.prototype.click = function () { w.HTMLAnchorElement.prototype.click = oc; resolve(this.download); };
      });
      d.getElementById('btn-png').click();
      const tname = await Promise.race([tpng, sleep(5000).then(() => null)]);
      check(/-table\.png$/.test(tname || ''), `Table tab exports the table image (${tname})`);
      const realPrint = w.print; w.print = () => {};
      d.getElementById('btn-print').click(); await sleep(30);
      const pa = d.getElementById('print-area');
      check(pa.querySelector('table.print-table') && pa.querySelectorAll('tbody tr').length === count() && !pa.querySelector('svg'),
        `Table tab prints the table (${pa.querySelectorAll('tbody tr').length} rows, no chart)`);
      d.querySelector('.tabs button[data-view="split"]').click(); await sleep(60);
      d.getElementById('btn-print').click(); await sleep(30);
      check(pa.querySelector('svg.gantt-print') && !pa.querySelector('table'), 'Table/Gantt still prints the Gantt chart');
      w.print = realPrint;
      w.dispatchEvent(new w.Event('afterprint'));

      // ---- PNG export: capture the download instead of saving it ----
      const captured = new Promise(resolve => {
        const origURL = w.URL.createObjectURL, origClick = w.HTMLAnchorElement.prototype.click;
        let lastBlob = null;
        w.URL.createObjectURL = b => { lastBlob = b; return origURL.call(w.URL, b); };
        w.HTMLAnchorElement.prototype.click = function () {
          if (!this.download.endsWith('.png')) return origClick.call(this);
          w.URL.createObjectURL = origURL; w.HTMLAnchorElement.prototype.click = origClick;
          resolve({ name: this.download, blob: lastBlob });
        };
      });
      d.getElementById('btn-png').click();
      const dl = await Promise.race([captured, sleep(5000).then(() => null)]);
      check(dl && /-gantt\.png$/.test(dl.name), `PNG download offered (${dl?.name})`);
      if (dl) {
        const blob = dl.blob;
        const bmp = new Image();
        bmp.src = URL.createObjectURL(blob);
        await bmp.decode();
        const svgW = d.querySelector('#gantt-pane .g-body svg').width.baseVal.value + 280;
        check(blob.type === 'image/png' && bmp.width === svgW * 2, `PNG is 2× the chart width (${bmp.width} px for ${svgW} px chart)`);
        // Sample pixels: white background, and red somewhere (critical path)
        const c = Object.assign(document.createElement('canvas'), { width: bmp.width, height: bmp.height }), cx = c.getContext('2d');
        cx.drawImage(bmp, 0, 0);
        const px = cx.getImageData(0, 0, bmp.width, bmp.height).data;
        let red = 0;
        for (let k = 0; k < px.length; k += 16) if (px[k] > 200 && px[k + 1] < 80 && px[k + 2] < 80) red++;
        check(red > 100, `critical path drawn in red (${red} sampled red pixels)`);
        document.body.insertAdjacentHTML('beforeend', `<h2>Exported PNG</h2><img id="png-out" style="max-width:100%;border:1px solid #ccc" src="${bmp.src}">`);
      }

      // ---- PERT tab ----
      d.querySelector('.tabs button[data-view="pert"]').click();
      await sleep(80);
      const nodes = d.querySelectorAll('#pert-pane .pt-node');
      const leafRows = [...d.querySelectorAll('#tbody tr[data-id]')].filter(tr => !tr.classList.contains('summary')).length;
      check(nodes.length === leafRows && d.getElementById('zoom').disabled, `PERT tab draws one box per task (${nodes.length}); zoom disabled`);
      check(d.querySelectorAll('#pert-pane .pt-node.critical').length === d.querySelectorAll('#tbody tr.critical').length,
        'PERT critical boxes match critical rows');
      const fw = [...nodes].find(n => n.textContent.includes('Firmware'));
      d.getElementById('tip').hidden = true;
      fw.querySelector('.pt-box').dispatchEvent(new w.PointerEvent('pointerover', { bubbles: true }));
      check(!d.getElementById('tip').hidden && /Firmware/.test(d.getElementById('tip').textContent), 'hovering a PERT box shows its details');
      fw.dispatchEvent(new w.MouseEvent('click', { bubbles: true, detail: 1 }));
      await sleep(20);
      check(fw.classList.contains('selected') && d.querySelector('#tbody tr.selected input[data-f="name"]').value === 'Firmware',
        'clicking a PERT box selects that task');
      const pngPert = new Promise(resolve => {
        const orig = w.HTMLAnchorElement.prototype.click;
        w.HTMLAnchorElement.prototype.click = function () { w.HTMLAnchorElement.prototype.click = orig; resolve(this.download); };
      });
      d.getElementById('btn-png').click();
      const pertName = await Promise.race([pngPert, sleep(5000).then(() => null)]);
      check(/-pert\.png$/.test(pertName || ''), `Export PNG on the PERT tab exports the diagram (${pertName})`);
      fw.dispatchEvent(new w.MouseEvent('dblclick', { bubbles: true, detail: 2 }));
      await sleep(60);
      check(d.getElementById('main').className === 'view-split-pert' && d.activeElement?.value === 'Firmware'
        && d.getElementById('pert-pane').offsetHeight > 0 && d.getElementById('gantt-pane').offsetHeight === 0,
        'double-clicking a PERT task opens Table/PERT with the task focused');
      check(d.getElementById('zoom').disabled && d.querySelector('.tabs button[aria-selected="true"]').textContent === 'Table/PERT',
        'Table/PERT tab is selected; zoom disabled');
      d.querySelector('.tabs button[data-view="split"]').click();
      await sleep(60);

      // ---- Column resizing ----
      d.querySelector('.tabs button[data-view="split"]').click(); await sleep(60);
      const th = f => d.querySelector(`#thead th[data-col="${f}"]`);
      const thW = f => Math.round(th(f).getBoundingClientRect().width);
      const rs = f => th(f).querySelector('.col-rs');
      const dragBy = async (el, dx) => {
        const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
        const ev = (type, cx) => el.dispatchEvent(new w.PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 7, button: 0, clientX: cx, clientY: y }));
        ev('pointerdown', x); ev('pointermove', x + dx / 2); ev('pointermove', x + dx); ev('pointerup', x + dx);
        await sleep(60);
      };
      check(thW('name') === 260 && thW('start') === 150, `default widths (name ${thW('name')}, start ${thW('start')})`);
      const order0 = names().join('|');
      await dragBy(rs('name'), 100);
      check(Math.abs(thW('name') - 360) <= 1, `dragging the Task name edge widens it by 100 px (${thW('name')})`);
      check(names().join('|') === order0 && count() === order0.split('|').length, 'resizing does not reorder or add rows');
      await dragBy(rs('start'), -300);
      check(thW('start') === 124, `a column stops at its minimum width (start ${thW('start')}, min 124)`);
      rs('start').dispatchEvent(new w.MouseEvent('dblclick', { bubbles: true }));
      await sleep(30);
      check(thW('start') === 150, `double-clicking the edge resets the column (${thW('start')})`);
      await dragBy(rs('num'), 20);
      check(names().join('|') === order0, 'dragging the # column edge resizes instead of moving a row');
      rs('num').dispatchEvent(new w.MouseEvent('dblclick', { bubbles: true })); await sleep(30);
      // the row-number grip still reorders rows
      await drag(row(6).querySelector('.c-num'), row(8).getBoundingClientRect().bottom - 2);
      check(cell(8, 'name').value === 'Mechanical CAD', 'the # grip still reorders rows after resizing');
      await click('undo');
      // Gantt task-name divider
      const gLabW = () => Math.round(d.querySelector('#gantt-pane .g-labels svg').width.baseVal.value);
      check(gLabW() === 280, `Gantt name column defaults to 280 (${gLabW()})`);
      await dragBy(d.getElementById('gantt-rs'), 80);
      check(gLabW() === 360 && parseInt(d.getElementById('gantt-rs').style.left) === 360, `dragging the Gantt divider widens the name column (${gLabW()})`);
      await dragBy(d.getElementById('gantt-rs'), -1000);
      check(gLabW() === 120, `the Gantt name column stops at 120 px (${gLabW()})`);
      d.getElementById('gantt-rs').dispatchEvent(new w.MouseEvent('dblclick', { bubbles: true })); await sleep(30);
      check(gLabW() === 280, 'double-clicking the divider resets it');
      await dragBy(d.getElementById('gantt-rs'), 40);
      // Exports follow the widths
      const gsvg = d.getElementById('btn-print'); w.print = () => {};
      gsvg.click(); await sleep(30);
      const pr = d.querySelector('#print-area svg.gantt-print');
      check(pr && /^0 0 /.test(pr.getAttribute('viewBox')) && d.querySelector('#print-area svg.gantt-print rect.g-label-bg').getAttribute('width') === '320',
        'printed Gantt uses the resized name column (320 px)');
      d.querySelector('.tabs button[data-view="table"]').click(); await sleep(60);
      gsvg.click(); await sleep(30);
      const cols = [...d.querySelectorAll('#print-area .print-table col')].map(c => parseFloat(c.style.width));
      check(cols.length === 10 && cols[1] > 30, `printed table gives Task name a larger share after widening (${cols[1].toFixed(1)}%)`);
      w.dispatchEvent(new w.Event('afterprint'));
      d.querySelector('.tabs button[data-view="split"]').click(); await sleep(60);

      // Help shows the version and links to the changelog
      const ver = d.getElementById('app-version')?.textContent;
      const clink = [...d.querySelectorAll('#dlg-help a')].find(a => /CHANGELOG\.md$/.test(a.href));
      check(/^\d+\.\d+\.\d+$/.test(ver || '') && clink, `Help shows version ${ver} and links to the changelog`);
      const clog = await (await fetch('../CHANGELOG.md')).text();
      check(clog.includes(`## ${ver} — `), `CHANGELOG.md has an entry for version ${ver}`);

      // Persistence: reload the frame, plan is still there with edits
      const name = d.getElementById('plan-name').textContent;
      w.location.reload();
      await new Promise(r => frame.addEventListener('load', r, { once: true }));
      await sleep(400);
      const d2 = frame.contentDocument;
      check(d2.getElementById('plan-name').textContent === name && d2.querySelectorAll('#tbody tr[data-id]').length === n0 + 1,
        'plan persists across reload');
      check(Math.round(d2.querySelector('#thead th[data-col="name"]').getBoundingClientRect().width) === 360
        && Math.round(d2.querySelector('#gantt-pane .g-labels svg').width.baseVal.value) === 320,
        'column widths survive a reload (per-browser preference)');
    } catch (e) {
      check(false, `exception: ${e.message}`);
    }

    const failed = results.filter(r => !r[0]).length;
    document.getElementById('out').innerHTML = results
      .map(([ok, msg]) => `<span class="${ok ? 'pass' : 'fail'}">${ok ? 'PASS' : 'FAIL'}  ${msg}</span>`)
      .join('\n') + `\n\n${results.length - failed}/${results.length} passed`;
  </script>
</body>
</html>
